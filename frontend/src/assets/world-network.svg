<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Radial Vignette -->
    <radialGradient id="vignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141419" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#070709" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020203" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arc Gradients -->
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="arc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="1920" height="1080" fill="url(#vignette)" />

  <!-- Global Coordinate Latitude / Longitude Rings -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" fill="none">
    <circle cx="960" cy="540" r="280" stroke-dasharray="3 6" />
    <circle cx="960" cy="540" r="480" stroke-dasharray="4 8" />
    <circle cx="960" cy="540" r="720" stroke-dasharray="2 10" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke-dasharray="4 8" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke-dasharray="4 8" />
  </g>

  <!-- World Continents Dot Matrix (Stylized Real World Map) -->
  <g fill="#ffffff" fill-opacity="0.12">
    <!-- North America (Canada & US) -->
    <circle cx="340" cy="280" r="3"/><circle cx="360" cy="270" r="2.5"/><circle cx="380" cy="260" r="3"/>
    <circle cx="400" cy="270" r="3"/><circle cx="420" cy="280" r="3"/><circle cx="440" cy="290" r="2.5"/>
    <circle cx="320" cy="320" r="3"/><circle cx="350" cy="320" r="3.5"/><circle cx="380" cy="330" r="3.5"/>
    <circle cx="420" cy="340" r="4"/><circle cx="450" cy="350" r="4"/><circle cx="480" cy="360" r="4"/>
    <circle cx="340" cy="380" r="3"/><circle cx="370" cy="390" r="3.5"/><circle cx="410" cy="400" r="4"/>
    <circle cx="440" cy="410" r="3.5"/><circle cx="470" cy="420" r="3.5"/>
    <circle cx="380" cy="440" r="3"/><circle cx="410" cy="450" r="3"/><circle cx="430" cy="460" r="2.5"/>

    <!-- South America -->
    <circle cx="510" cy="540" r="3"/><circle cx="530" cy="560" r="3.5"/><circle cx="560" cy="580" r="3.5"/>
    <circle cx="520" cy="610" r="3.5"/><circle cx="550" cy="630" r="3"/><circle cx="580" cy="640" r="3"/>
    <circle cx="530" cy="680" r="3"/><circle cx="550" cy="710" r="2.5"/><circle cx="540" cy="760" r="2"/>

    <!-- Europe & UK -->
    <circle cx="920" cy="250" r="3"/><circle cx="940" cy="240" r="3"/><circle cx="960" cy="260" r="3.5"/>
    <circle cx="910" cy="290" r="3.5"/><circle cx="940" cy="290" r="4"/><circle cx="970" cy="300" r="4"/>
    <circle cx="1000" cy="290" r="3.5"/><circle cx="1030" cy="280" r="3"/><circle cx="930" cy="330" r="3.5"/>
    <circle cx="960" cy="340" r="4"/><circle cx="990" cy="340" r="3.5"/><circle cx="1020" cy="340" r="3.5"/>

    <!-- Africa -->
    <circle cx="940" cy="420" r="3"/><circle cx="970" cy="430" r="3.5"/><circle cx="1000" cy="440" r="3.5"/>
    <circle cx="930" cy="470" r="3.5"/><circle cx="960" cy="490" r="4"/><circle cx="990" cy="500" r="4"/>
    <circle cx="1020" cy="510" r="3.5"/><circle cx="950" cy="560" r="3.5"/><circle cx="980" cy="570" r="3.5"/>
    <circle cx="970" cy="630" r="3"/><circle cx="990" cy="660" r="3"/><circle cx="1000" cy="710" r="2.5"/>

    <!-- Asia & Middle East -->
    <circle cx="1080" cy="290" r="3"/><circle cx="1120" cy="280" r="3.5"/><circle cx="1160" cy="290" r="3.5"/>
    <circle cx="1210" cy="290" r="3.5"/><circle cx="1260" cy="300" r="3"/><circle cx="1310" cy="310" r="3"/>
    <circle cx="1100" cy="350" r="3.5"/><circle cx="1150" cy="360" r="4"/><circle cx="1200" cy="370" r="4"/>
    <circle cx="1250" cy="370" r="4"/><circle cx="1300" cy="380" r="4"/><circle cx="1350" cy="390" r="4"/>
    <circle cx="1160" cy="430" r="3.5"/><circle cx="1200" cy="440" r="4"/><circle cx="1240" cy="450" r="4"/>
    <circle cx="1280" cy="450" r="4"/><circle cx="1340" cy="460" r="3.5"/><circle cx="1380" cy="440" r="4"/>

    <!-- Australia & New Zealand -->
    <circle cx="1460" cy="680" r="3"/><circle cx="1500" cy="690" r="3.5"/><circle cx="1540" cy="700" r="3.5"/>
    <circle cx="1470" cy="730" r="3.5"/><circle cx="1510" cy="740" r="4"/><circle cx="1550" cy="740" r="3.5"/>
    <circle cx="1500" cy="780" r="3"/><circle cx="1530" cy="790" r="3"/><circle cx="1620" cy="820" r="2.5"/>
  </g>

  <!-- Prominent Glowing Financial Wire Routes -->
  <g stroke-linecap="round" fill="none">
    <!-- NY to London Interbank Bridge -->
    <path d="M 470 360 Q 700 160 940 290" stroke="url(#arc1)" stroke-width="2.5" filter="url(#glow)" />
    <!-- London to Frankfurt (ECB) -->
    <path d="M 940 290 L 980 320" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)" />
    <!-- Frankfurt to Singapore -->
    <path d="M 980 320 Q 1150 280 1320 540" stroke="url(#arc2)" stroke-width="2" filter="url(#glow)" />
    <!-- Singapore to Tokyo -->
    <path d="M 1320 540 Q 1380 440 1420 370" stroke="#34d399" stroke-width="2" stroke-opacity="0.7" filter="url(#glow)" />
    <!-- Tokyo to New York Transpacific Route -->
    <path d="M 1420 370 Q 1700 240 1880 280" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" />
    <path d="M 40 290 Q 240 260 470 360" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" />
    <!-- NY to Zurich / Geneva -->
    <path d="M 470 360 Q 720 220 990 330" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 6" stroke-opacity="0.5" />
  </g>

  <!-- Major Glowing Interbank Exchange Hubs -->
  <!-- New York (FED / Wall St) -->
  <g transform="translate(470, 360)" filter="url(#glow-strong)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <text x="14" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.9">NYC (FED)</text>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">40.71°N 74.00°W</text>
  </g>

  <!-- London (LSE / Bank of England) -->
  <g transform="translate(940, 290)" filter="url(#glow-strong)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <text x="14" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.9">LON (LSE)</text>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">51.50°N 0.12°W</text>
  </g>

  <!-- Frankfurt (ECB - European Central Bank) -->
  <g transform="translate(980, 320)" filter="url(#glow-strong)">
    <circle cx="0" cy="0" r="16" fill="#10b981" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="9" fill="none" stroke="#10b981" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4.5" fill="#34d399" />
    <text x="16" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#34d399">ECB (FRANKFURT)</text>
    <text x="16" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">EUR Primary Benchmark</text>
  </g>

  <!-- Tokyo (BOJ / TSE) -->
  <g transform="translate(1420, 370)" filter="url(#glow-strong)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <text x="14" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.9">TYO (BOJ)</text>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">35.67°N 139.65°E</text>
  </g>

  <!-- Singapore (MAS) -->
  <g transform="translate(1320, 540)" filter="url(#glow-strong)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.9">SGP (MAS)</text>
  </g>

  <!-- Data Flow Packets Travelling On Wires -->
  <circle cx="680" cy="220" r="2.5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="470;940" dur="4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="360;290" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1120" cy="400" r="2.5" fill="#34d399" filter="url(#glow)">
    <animate attributeName="cx" values="980;1320" dur="5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="320;540" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
