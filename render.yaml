services:
  - type: web
    name: trustfx-aggregator
    env: node
    plan: free
    buildCommand: npm install && npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
